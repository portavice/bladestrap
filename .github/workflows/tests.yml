name: Run tests

on: [ push ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.3
          - 8.4
          - 8.5
          - 8.6
        laravel:
          - 12.*
          - 13.*
        dependency-version:
          - prefer-lowest
          - prefer-stable
        include:
          - laravel: 12.*
            testbench: ^10.6
          - laravel: 13.*
            testbench: ^11.0
        exclude:
          # Laravel 12 lacks create_sid()/validateId() in its session handlers, causing deprecations on PHP 8.6.
          - php: 8.6
            laravel: 12.*

    name: Tests P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: composer test
